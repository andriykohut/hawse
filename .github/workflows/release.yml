name: release
on:
  pull_request:
    paths-ignore: ["site/**"]
  push:
    branches: [main]
    tags: ["v*"]
    # Not applied to a tag push, so a release tag always runs.
    paths-ignore: ["site/**"]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - id: read
        run: |
          version=$(.github/scripts/version.sh)
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            features: --no-default-features --features ring
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
            features: --no-default-features --features ring
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-26.04
            features: --no-default-features --features ring
          - target: aarch64-apple-darwin
            os: macos-latest
            features: ""
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-about@0.9.2
      # cross's own dependencies do not build under the workflow's -D warnings.
      - if: runner.os == 'Linux'
        run: cargo install cross --git https://github.com/cross-rs/cross --locked
        env:
          RUSTFLAGS: ""
      - if: runner.os == 'Linux'
        run: cross build --release --target "$TARGET" -p hawse ${{ matrix.features }}
      - if: runner.os == 'macOS'
        run: cargo build --release --target "$TARGET" -p hawse ${{ matrix.features }}
      - run: >-
          cargo about generate --fail --locked -c about.toml -m crates/hawse/Cargo.toml
          --target "$TARGET" ${{ matrix.features }} -o target/notices.txt about.hbs
      - run: .github/scripts/package.sh "$TARGET" "$VERSION" target/notices.txt dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hawse-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  crates-check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo package --workspace

  image:
    needs: [version, build]
    runs-on: ubuntu-26.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hawse-*-linux-*
          path: dist
          merge-multiple: true
      - run: .github/scripts/image-context.sh dist "$VERSION" context
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: .github/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: .github/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: hawse:ci
      - run: |
          got=$(docker run --rm hawse:ci --version)
          if [[ "$got" != "hawse $VERSION" ]]; then
            echo "::error::expected 'hawse $VERSION' from the image, got '$got'"
            exit 1
          fi
          docker run --rm hawse:ci keygen

  # Pull requests and main already run ci.yml on their own; a tag push does not.
  ci:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/ci.yml

  publish-crates:
    if: github.ref_type == 'tag'
    needs: [version, build, crates-check, image, ci]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable
      - id: pending
        run: |
          crates=$(.github/scripts/unpublished-crates.sh "$VERSION" hawse-proto hawse-core hawse | paste -sd' ' -)
          echo "crates=$crates" >> "$GITHUB_OUTPUT"
      - if: steps.pending.outputs.crates != ''
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.pending.outputs.crates }}
        run: |
          read -ra crates <<<"$CRATES"
          # crates-check verified these without credentials. Verifying here would run dependency
          # build scripts beside the crates.io token.
          for crate in "${crates[@]}"; do
            cargo publish --no-verify -p "$crate"
          done

  github-release:
    if: github.ref_type == 'tag'
    needs: publish-crates
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hawse-*
          path: dist
          merge-multiple: true
      - working-directory: dist
        run: sha256sum hawse-*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/hawse-*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes "${flags[@]}" dist/*

  publish-image:
    if: github.ref_type == 'tag'
    needs: [version, publish-crates]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: hawse-*-linux-*
          path: dist
          merge-multiple: true
      - run: .github/scripts/image-context.sh dist "$VERSION" context
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=semver,pattern={{version}}
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: context
          file: .github/docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
