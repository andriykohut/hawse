name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    # Not ubuntu-latest: the 24.04 image runs kernel 6.17, where loopback TCP stalls the tunnel
    # transfer tests in about one run in a hundred. 6.8 and 7.0 do not.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-default-features --features ring
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features --features ring
  deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
