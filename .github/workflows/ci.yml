name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-default-features --features ring
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features --features ring
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            toolchain: stable
          - target: aarch64-unknown-linux-musl
            toolchain: stable
          - target: armv7-unknown-linux-musleabihf
            toolchain: stable
          # Tier 3: no prebuilt std, so Cross.toml builds it from rust-src.
          - target: mipsel-unknown-linux-musl
            toolchain: nightly
            components: rust-src
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: ${{ matrix.components }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # cross's own dependencies do not build under the workflow's -D warnings.
      - run: cargo install cross --git https://github.com/cross-rs/cross --locked
        env:
          RUSTFLAGS: ""
      - run: cross +${{ matrix.toolchain }} build --release --target ${{ matrix.target }} -p hawse --no-default-features --features ring
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo build --release -p hawse
