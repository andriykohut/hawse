name: ci
on:
  push:
    branches: [main]
    paths-ignore: ['site/**']
  pull_request:
    paths-ignore: ['site/**']
  workflow_call:
# A push to a pull request supersedes the run for its last one. Every other run has a group of its
# own, so runs on main and for a release tag neither wait for each other nor are cancelled.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
jobs:
  check:
    # Not ubuntu-latest: the 24.04 image runs kernel 6.17, where loopback TCP stalls the tunnel
    # transfer tests in about one run in a hundred. 6.8 and 7.0 do not.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo clippy --workspace --all-targets --no-default-features --features ring
      - run: cargo test --workspace
      - run: cargo test --workspace --no-default-features --features ring
  service:
    # Not ubuntu-latest, for the same reason as check.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p hawse
      - run: .github/scripts/service-check.sh
      - if: failure()
        run: |
          systemctl status --no-pager hawse-server hawse-client || true
          sudo journalctl --no-pager -n 200 -u hawse-server -u hawse-client
  deny:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
