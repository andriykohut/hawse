name: site
on:
  push:
    branches: [main]
    paths: ['site/**', 'assets/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'assets/**', '.github/workflows/site.yml']
  workflow_dispatch:
permissions:
  contents: read
# One run per ref at a time and in order, so an older build cannot deploy after a newer one. A
# deployment in progress is left to finish; a pull request's build, which deploys nothing, gives
# way to a newer push.
concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
