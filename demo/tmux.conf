# Plain shells, so nobody's own prompt or tmux settings end up in the recording.
set -g default-command "bash --noprofile --norc"
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"
set -g status off
set -g escape-time 0
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
set -g pane-border-style "fg=#9399b2"
set -g pane-active-border-style "fg=#e8632b"
