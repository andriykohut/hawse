[package]
name = "hawse"
description = "Reverse TCP tunnel over QUIC with Ed25519 authentication"
keywords = ["tunnel", "reverse-tunnel", "quic", "port-forwarding", "self-hosted"]
categories = ["command-line-utilities", "network-programming"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ version }-{ target }.tar.gz"
bin-dir = "{ name }-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[[bin]]
name = "hawse"
path = "src/main.rs"

[features]
default = ["aws-lc-rs"]
ring = ["hawse-core/ring"]
aws-lc-rs = ["hawse-core/aws-lc-rs"]

[dependencies]
hawse-core.workspace = true
hawse-proto.workspace = true
clap.workspace = true
etcetera.workspace = true
miette.workspace = true
rustix.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true

[lints]
workspace = true
